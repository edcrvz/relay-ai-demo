<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Listing Radar demo: new listings, agent contacts and GoHighLevel sync.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Listing Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: fixed ink sidebar + scrolling workspace; inbox is a 3-pane messenger, other views are panels/cards by role */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --surface-2:#F7F9FA; --line:#E2E7EB; --fg:#16232D; --muted:#5E6D78;
  --side-bg:#0E2633; --side-fg:#C9D6DE; --side-active:#1B3B4C; --side-muted:#7F97A5;
  --accent:#0F7C8C; --accent-soft:#E2F2F4; --accent-fg:#FFFFFF;
  --hot:#C2410C; --hot-soft:#FDEBDF; --warm:#A16207; --warm-soft:#FBF1D6; --cold:#3F6A8A; --cold-soft:#E3EDF5;
  --good:#15803D; --good-soft:#E0F2E7; --violet:#6D4FC2; --violet-soft:#EEE9FA;
  --banner-a:#0E2633; --banner-b:#13495A;
  --chat-bg:#EEF2F1; --bub-in:#FFFFFF; --bub-ai:#DDF1EC; --bub-hu:#E4EAF6;
  --tip-bg:#0E2633; --tip-fg:#FFFFFF;
  --f-display:"Manrope",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1419; --surface:#131E25; --surface-2:#18252D; --line:#24343E; --fg:#E4ECF0; --muted:#93A5B0;
  --side-bg:#08161E; --side-fg:#C9D6DE; --side-active:#16313F; --side-muted:#6F8896;
  --accent:#3FB5C4; --accent-soft:#123540; --accent-fg:#06232A;
  --hot:#F28B5B; --hot-soft:#3A2016; --warm:#E3B54A; --warm-soft:#33290F; --cold:#86B3D6; --cold-soft:#18293A;
  --good:#5BC98A; --good-soft:#132D20; --violet:#A994EE; --violet-soft:#241D3D; --banner-a:#0F2B38; --banner-b:#12404F;
  --chat-bg:#0F191F; --bub-in:#1A2830; --bub-ai:#15343A; --bub-hu:#1C2740; --tip-bg:#E4ECF0; --tip-fg:#0E2633; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1419; --surface:#131E25; --surface-2:#18252D; --line:#24343E; --fg:#E4ECF0; --muted:#93A5B0;
  --side-bg:#08161E; --side-fg:#C9D6DE; --side-active:#16313F; --side-muted:#6F8896;
  --accent:#3FB5C4; --accent-soft:#123540; --accent-fg:#06232A;
  --hot:#F28B5B; --hot-soft:#3A2016; --warm:#E3B54A; --warm-soft:#33290F; --cold:#86B3D6; --cold-soft:#18293A;
  --good:#5BC98A; --good-soft:#132D20; --violet:#A994EE; --violet-soft:#241D3D; --banner-a:#0F2B38; --banner-b:#12404F;
  --chat-bg:#0F191F; --bub-in:#1A2830; --bub-ai:#15343A; --bub-hu:#1C2740; --tip-bg:#E4ECF0; --tip-fg:#0E2633; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* Sidebar */
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-fg);padding:9px 12px;border-radius:8px;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.08);padding:1px 7px;border-radius:20px}
.nav .count.alert{background:#C2410C;color:#fff}
.side h6{margin:20px 12px 8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.pipes{display:flex;flex-direction:column;gap:2px}
.pipes div{display:flex;align-items:center;gap:10px;padding:6px 12px;font-size:13px}
.pipes i{width:8px;height:8px;border-radius:2px;display:block}
.pipes span:last-child{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--side-muted)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 10px 2px;border-top:1px solid rgba(255,255,255,.07)}
.av{width:32px;height:32px;border-radius:50%;background:#2A5568;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.me b{display:block;color:#fff;font-size:13px;font-weight:600}
.me small{color:var(--side-muted);font-size:11.5px}
/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding-block:14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top h1{font-family:var(--f-display);font-size:19px;margin:0;line-height:1.2}
.top p{margin:0;color:var(--muted);font-size:12.5px}
.top .grow{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 12px;width:260px;max-width:100%}
.search input{border:0;background:none;outline:0;width:100%}
.search svg,.iconbtn svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:38px;height:38px;display:grid;place-items:center;position:relative;flex:none}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--hot)}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.small{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.menu{display:none}
.content{padding-block:24px 40px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.demo-tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);background:var(--warm-soft);padding:3px 8px;border-radius:5px}
.note{color:var(--muted);font-size:13px;margin:0}
/* Home */
.banner{border-radius:14px;padding:24px 28px;color:#fff;background:linear-gradient(120deg,var(--banner-a),var(--banner-b));display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.banner .big{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px}
.banner small{opacity:.75}
.banner h2{font-family:var(--f-display);font-size:26px;margin:2px 0}
.banner .meta{margin-left:auto;text-align:right;font-size:13px}
.banner .meta b{display:block;font-size:15px}
.banner .meta span{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:help}
.stat:hover{border-color:var(--accent)}
.stat .row{display:flex;align-items:center;justify-content:space-between}
.stat .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center}
.stat .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat .num{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .lab{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel h3{font-family:var(--f-display);font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel h3 .link{margin-left:auto;font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--accent);background:none;border:0}
.rows{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--surface-2)}
.lrow .who{min-width:0;flex:1}
.lrow .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .who small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:12.5px;font-weight:600;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.pill{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.Hot{color:var(--hot);background:var(--hot-soft)} .Warm{color:var(--warm);background:var(--warm-soft)} .Cold{color:var(--cold);background:var(--cold-soft)}
.mode{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap}
.mode.ai{background:var(--accent-soft);color:var(--accent)}
.mode.human{background:var(--violet-soft);color:var(--violet)}
.feed{display:flex;flex-direction:column;gap:12px}
.ev{display:flex;gap:10px;font-size:13px}
.ev i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;font-style:normal;font-size:11px;font-weight:700}
.ev small{display:block;color:var(--muted);font-size:11.5px}
/* Inbox */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr) 290px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:calc(100vh - 150px);min-height:560px}
.ilist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ilist .tabs{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.convs{overflow-y:auto;flex:1}
.conv{display:flex;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;align-items:flex-start}
.conv:hover{background:var(--surface-2)}
.conv[aria-current="true"]{background:var(--accent-soft)}
.conv .av{background:var(--accent)}
.conv .mid{min-width:0;flex:1}
.conv .mid b{display:flex;gap:6px;align-items:center;font-weight:600}
.conv .mid b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .mid small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.conv .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:var(--muted);flex:none}
.unread{background:var(--good);color:#fff;font-family:var(--f-mono);font-size:10.5px;border-radius:20px;padding:0 6px;line-height:17px}
.chat{display:flex;flex-direction:column;min-width:0;background:var(--chat-bg)}
.chat header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat header .who{min-width:0;flex:1}
.chat header b{display:block}
.chat header small{color:var(--muted);font-size:12px}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:min(78%,460px);padding:8px 12px;border-radius:12px;font-size:13.5px;position:relative;box-shadow:0 1px 1px rgba(10,30,40,.06)}
.bub small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.bub.c{background:var(--bub-in);align-self:flex-start;border-top-left-radius:4px}
.bub.a{background:var(--bub-ai);align-self:flex-end;border-top-right-radius:4px}
.bub.h{background:var(--bub-hu);align-self:flex-end;border-top-right-radius:4px}
.bub .tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.bub.a .tag{color:var(--accent)} .bub.h .tag{color:var(--violet)}
.sysmsg{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 12px;text-align:center}
.typing{align-self:flex-end;font-size:12px;color:var(--accent);font-style:italic}
.composer{display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap}
.composer select{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2);font-size:12.5px}
.composer input{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface-2)}
.quick{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap;background:var(--surface)}
.quick button{border:1px dashed var(--line);background:none;border-radius:20px;padding:3px 10px;font-size:12px;color:var(--muted)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.modeswitch{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.modeswitch button{border:0;background:none;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.modeswitch button[aria-pressed="true"].ai{background:var(--accent-soft);color:var(--accent)}
.modeswitch button[aria-pressed="true"].human{background:var(--violet-soft);color:var(--violet)}
.runpanel{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;align-self:stretch;font-size:13px}
.runpanel h4{margin:0 0 8px;font-family:var(--f-display);font-size:13.5px;display:flex;align-items:center;gap:8px}
.runpanel h4 button{margin-left:auto}
.runpanel ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.runpanel li{display:flex;gap:8px;align-items:flex-start}
.runpanel li i{width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;font-style:normal;font-size:10px;display:grid;place-items:center;flex:none;margin-top:1px}
.runpanel li small{color:var(--muted);display:block;font-size:11.5px}
.info{border-left:1px solid var(--line);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.info h4,.drawer h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.ai-box{background:var(--accent-soft);border-radius:10px;padding:11px 13px;font-size:13px}
.ai-box b{color:var(--accent)}
.mem{display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none;font-size:13px}
.mem li{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
select.full{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--surface-2);width:100%}
/* Board */
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 13px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:300px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col header{display:flex;align-items:center;gap:8px;font-weight:600;font-family:var(--f-display)}
.col header i{width:9px;height:9px;border-radius:2px}
.col header span{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.col .sum{font-size:12px;color:var(--muted);margin-top:-6px;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:grab;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.dragging{opacity:.4}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card b{font-weight:600}
.card small{color:var(--muted)}
.card .f{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:6px}
.card .f b{color:var(--fg);font-variant-numeric:tabular-nums}
.empty-col{color:var(--muted);font-size:12.5px;text-align:center;padding:20px 8px;border:1px dashed var(--line);border-radius:9px}
/* Table */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
.stage-chip{font-size:12px;padding:2px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:12px}
/* Agents */
.agents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.agent[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.agent header{display:flex;align-items:center;gap:10px}
.agent .aic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-family:var(--f-display);font-size:12px;flex:none}
.agent b{font-family:var(--f-display);font-size:14px}
.agent p{margin:0;color:var(--muted);font-size:12.5px}
.agent .runs{font-size:12px;color:var(--muted);margin-top:auto}
.editor{display:flex;flex-direction:column;gap:12px}
.editor label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.editor textarea,.editor input,.editor select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface-2);font-weight:400;color:var(--fg)}
.editor .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}

.switch{margin-left:auto;width:38px;height:22px;border-radius:20px;border:0;background:var(--line);position:relative;flex:none}

.hbar{display:flex;flex-direction:column;gap:12px}

.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .track div{height:100%;background:var(--accent);border-radius:5px}
.hbar .r b{text-align:right;font-variant-numeric:tabular-nums}
.funnel{display:flex;flex-direction:column;gap:8px}

.funnel .bar{height:30px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;padding:0 10px;font-weight:600;font-size:12.5px;min-width:44px}

.wf svg.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wire{fill:none;stroke:var(--line);stroke-width:1.6;transition:stroke .2s,opacity .2s}
.wf .lbl{font-size:11px;font-weight:600;fill:var(--muted);font-family:var(--f-body);transition:opacity .2s}
.wire.lit{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:7 6;animation:flow .6s linear infinite}

.wf.focus .wire:not(.lit){opacity:.35}
.wf.focus .lbl{opacity:.4}
.wf .dotend{fill:var(--line)}
.node{position:absolute;width:150px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;transition:opacity .2s;cursor:pointer;border-radius:12px;padding:2px 0}
.node .tile{width:66px;height:66px;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 6px rgba(10,30,40,.08);position:relative;transition:border-color .2s,transform .2s,box-shadow .2s}

.node small{font-size:11px;color:var(--muted);line-height:1.3}

.node.done .tile::after{content:"✓";position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.runbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

const tipEl=$('#tip');let tipAnchor=null,tipPinned=false,lastPointer='mouse';
function tipHTML(el){const d=el.dataset;return `${d.tipApp?`<span class="app">${esc(d.tipApp)}</span>`:''}${d.tipTitle?`<b>${esc(d.tipTitle)}</b>`:''}<span>${esc(d.tip)}</span>${d.tipSaved?`<span class="saved">⏱ ${esc(d.tipSaved)}</span>`:''}${d.tipEx?`<span class="ex">${esc(d.tipEx)}</span>`:''}`}
function showTip(el,pin,html){tipAnchor=el;tipPinned=!!pin;tipEl.innerHTML=html||tipHTML(el);tipEl.classList.toggle('pinned',tipPinned);tipEl.hidden=false;placeTip()}
function placeTip(){
 if(tipEl.hidden)return;
 if(!tipAnchor||!document.body.contains(tipAnchor)){hideTip(true);return}
 const anchor=tipAnchor.querySelector('.tile')||tipAnchor;
 const r=anchor.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight,vw=document.documentElement.clientWidth,vh=window.innerHeight;
 let left=Math.max(8,Math.min(vw-w-8,r.left+r.width/2-w/2)),top=r.top-h-10,below=false;
 if(top<8){top=r.bottom+10;below=true}
 if(top+h>vh-8)top=Math.max(8,vh-h-8);
 tipEl.style.left=left+'px';tipEl.style.top=top+'px';tipEl.classList.toggle('below',below);
 tipEl.style.setProperty('--ax',Math.max(14,Math.min(w-14,r.left+r.width/2-left))+'px');
}
function hideTip(force){if(tipPinned&&!force)return;tipEl.hidden=true;tipAnchor=null;tipPinned=false;if(!state.flow)clearLit()}
document.addEventListener('pointerdown',e=>{lastPointer=e.pointerType||'mouse'},true);
document.addEventListener('mouseover',e=>{if(lastPointer==='touch')return;const el=e.target.closest&&e.target.closest('[data-tip]');if(!el||tipPinned||el===tipAnchor)return;showTip(el);if(el.dataset.node&&!state.flow)lightNode(el.dataset.node)});
document.addEventListener('mouseout',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el||tipPinned)return;if(e.relatedTarget&&el.contains(e.relatedTarget))return;hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!tipPinned){showTip(el);if(el.dataset.node&&!state.flow)lightNode(el.dataset.node)}});
document.addEventListener('focusout',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el&&!tipPinned&&(!e.relatedTarget||!el.contains(e.relatedTarget)))hideTip()});
window.addEventListener('scroll',placeTip,true);window.addEventListener('resize',placeTip);

 state.run={name:s.name,shown:0,steps:[
  ['Pulled 38 new listings from the licensed feed','Since the last scan, for '+s.loc],
  ['3 matched your filters','Price '+kmoney(s.min)+' – '+(s.max?kmoney(s.max):'no max')+' · '+s.type],
  ['1 duplicate skipped','Already saved from an earlier scan (seen on 3 portals)'],
  ['AI checked and categorized 2 listings','Price, beds, baths, sqft and status validated'],
  ['2 agents matched · 2 direct mobiles found','1 new agent (Tara Quinn), 1 existing (Rachel Moreno)'],
  ['GoHighLevel: 1 new contact, 1 updated, 1 opportunity','Custom fields filled and 4 tags added'],
  ['Slack alert sent to #new-listings','With address, price and direct numbers']
 ]};
 const step=k=>{
  if(!state.run)return;state.run.shown=k;
  if(k===4){if(isNew)agents.unshift(newAgent);
   const mk=(p,ag)=>{const l=L(p[0],p[1],p[2],p[3],p[4],p[5],p[6],0.02,'New',['Zillow','Realtor.com','Redfin'],ag);l.listed=now();l.fresh=true;l.ghl=k<6?'Syncing':'Synced';return l};
   listings.unshift(mk(picks[0],newAgent.id),mk(picks[1],'a1'));
   addEvent('+','acc',`<b>${esc(picks[0][0])}</b> found`,`${picks[0][1]} · ${money(picks[0][2])} · agent Tara Quinn`)}
  if(k===6){listings.forEach(l=>{if(l.ghl==='Syncing')l.ghl='Synced'});addEvent('G','good','Synced to GoHighLevel','1 new contact · 1 updated · 1 opportunity');s.found+=2}
  if(k===7)addEvent('!','hot','Slack alert sent',`${picks.length} new listings from "${esc(s.name)}"`);
  if(state.view==='listings')render();
  if(k<7)setTimeout(()=>step(k+1),1000);
 };
 render();setTimeout(()=>step(1),500);
}
function closeOverlay(){$('#overlay').innerHTML=''}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 const t=e.target,te=t.closest('[data-tip]');
 if(te&&lastPointer==='touch'&&!t.closest('.switch')&&!te.dataset.node)showTip(te,true);
 else if(!te&&!t.closest('#tip')&&!t.closest('#runbar')&&!state.flow)hideTip(true);
 const nb=t.closest('[data-v]');if(nb)return go(nb.dataset.v);
 const gb=t.closest('[data-go]');if(gb)return go(gb.dataset.go);
 if(t.closest('[data-close]'))return closeOverlay();
 const node=t.closest('[data-node]');if(node){if(state.flow)return;showTip(node,true);lightNode(node.dataset.node);return}
 if(t.closest('#runFlow'))return runStart();
 const rb=t.closest('[data-run]');if(rb){const a=rb.dataset.run,r=state.flow;if(a==='next'){r.playing=false;runStep(1)}else if(a==='back'){r.playing=false;runStep(-1)}else if(a==='pause'){r.playing=!r.playing;if(r.playing&&r.finished){r.i=0;r.finished=false}runShow();runTick()}else runStop();return}
 if(t.closest('[data-dismiss]')){state.run=null;listings.forEach(l=>l.fresh=false);return render()}
 const cb=t.closest('[data-city]');if(cb){state.city=cb.dataset.city;return render()}
 const pb=t.closest('[data-ptype]');if(pb){state.ptype=pb.dataset.ptype;return render()}
 const sw=t.closest('[data-auto]');if(sw){const a=autos.find(x=>x.id===sw.dataset.auto);a.on=!a.on;addEvent(a.on?'✓':'‖',a.on?'good':'warm',`<b>${esc(a.name)}</b> ${a.on?'turned on':'paused'}`,'Changed by Sam');return render()}
 const so=t.closest('[data-search-on]');if(so){const s=searches.find(x=>x.id===so.dataset.searchOn);s.on=!s.on;return render()}
 const rs=t.closest('[data-runsearch]');if(rs){return runScan(searches.find(x=>x.id===rs.dataset.runsearch))}
 const li=t.closest('[data-listing]');if(li)return openListing(li.dataset.listing);
 const ag=t.closest('[data-agent]');if(ag)return openAgent(ag.dataset.agent);
 if(t.closest('#bell'))return go('listings');
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeOverlay();$('#side').classList.remove('open');if(state.flow)runStop();else hideTip(true)}
 const c=e.target.closest&&e.target.closest('.card,[data-node]');
 if(c&&(e.key==='Enter'||e.key===' ')&&e.target===c){e.preventDefault();c.click()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.stagefor){const a=agentOf(t.dataset.stagefor);a.stage=t.value;addEvent('→','acc',`<b>${esc(a.name)}</b> moved to ${esc(stageOf(a.stage).name)}`,'Updated in GoHighLevel');renderNav();if(state.view==='board'||state.view==='agents')render()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card');if(!c)return;c.classList.add('dragging');e.dataTransfer.setData('text/plain',c.dataset.agent);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.col');if(!col)return;e.preventDefault();const a=agentOf(e.dataTransfer.getData('text/plain'));if(a&&a.stage!==col.dataset.stage){a.stage=col.dataset.stage;addEvent('→','good',`<b>${esc(a.name)}</b> moved to ${esc(stageOf(a.stage).name)}`,'Opportunity updated in GoHighLevel')}render()});
$('#q').addEventListener('input',e=>{state.q=e.target.value;if(!['listings','agents'].includes(state.view)){state.view='listings';try{history.replaceState(null,'','#listings')}catch(_){}}render();$('#q').focus()});
$('#newBtn').onclick=openNew;
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==state.view)go(h)});
render();
</script>
