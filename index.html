<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
:root{--bg:#F3F5F7;--fg:#16232D;--muted:#5E6D78;--accent:#0F7C8C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0C1419;--fg:#E4ECF0;--muted:#93A5B0;--accent:#3FB5C4;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px;box-sizing:border-box}
main{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.mark{width:44px;height:44px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:Manrope,system-ui,sans-serif;font-weight:700}
h1{font-family:Manrope,system-ui,sans-serif;font-size:22px;margin:6px 0 0}
p{margin:0;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<main>
<div class="mark">E</div>
<h1>Elmer · AI Automation Prototypes</h1>
<p>Each prototype has its own private link. Please use the link you were sent.</p>
</main>
</body>
</html>
